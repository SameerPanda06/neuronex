version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /dev/ttyUSB0:/dev/ttyUSB0  # ESP32 serial port (adjust for your system)
    environment:
      - SERIAL_PORT=/dev/ttyUSB0
      - SERIAL_BAUDRATE=115200
      - DATABASE_URL=sqlite:///neuronex.db
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - SECRET_KEY=dev-secret-change-in-production
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:5000
      - VITE_WS_URL=ws://localhost:5000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  neuronex_data: